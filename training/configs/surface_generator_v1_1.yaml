# 中文：surface generator（表面模板条件流）训练与生成配置。
# English: Training and generation configuration of the surface-template conditional flow.
# Author: Ruck
# Generated: 2026-07-29 22:30:47 Asia/Shanghai
# Revised: 2026-09-15 — 移除了重复的预测器段（model/training/loss/inference）；预测器配置只在
#          nfe_predictor*.yaml 中维护。生成器缓存保持 1.0 行为（不规范化），以便复用现有检查点。
# 提示 / Tip: 修改依赖、路径或阈值后，请重新运行测试与冒烟验证。
# Re-run tests and smoke validation after changing dependencies, paths, or thresholds.
# nfe-v1.1 版表面生成器配置：与 surface_generator.yaml 只差数据表、图缓存与检查点目录（2026-09-15）。
# nfe-v1.1 surface-generator config: differs from surface_generator.yaml only in table, graph cache and checkpoint dir.
seed: 2029

data:
  table: ../../data/full_v1_1/nfe_dataset.csv
  root: ../../data/full_v1_1
  cache: ../../cache/nfe_graphs_generator_v1_1.pt
  radius: 6.0
  max_neighbors: 36
  canonicalize: false
  complete_shells: false
  rebuild_cache: false
  max_cache_skip_fraction: 0.01
  num_workers: 8
  pin_memory: true

generator_model:
  hidden_dim: 192
  vector_dim: 64
  num_layers: 6
  num_rbf: 64
  cutoff: 12.0
  max_neighbors: 24
  dropout: 0.10
  max_atomic_number: 118
  element_features: 14
  condition_dim: 128

generator_training:
  epochs: 260
  batch_size_per_gpu: 32
  grad_accum_steps: 1
  learning_rate: 0.0002
  min_learning_rate: 0.000003
  weight_decay: 0.00001
  warmup_epochs: 10
  grad_clip: 5.0
  amp: true
  early_stopping_patience: 35
  checkpoint_dir: surface_generator_v1_1

generator_loss:
  coordinate_weight: 1.0
  lattice_weight: 0.35
  repulsion_weight: 0.30
  endpoint_weight: 1.0
  pair_distance_weight: 0.80
  layer_order_weight: 0.50
  surface_anchor_weight: 0.80
  oh_geometry_weight: 1.50
  minimum_distance_factor: 0.70
  core_template_noise_A: 0.18
  surface_template_noise_A: 0.35
  hydrogen_template_noise_A: 0.16
  lattice_template_noise: 0.10
  condition_dropout: 0.15

generation:
  sampling_steps: 80
  guidance_scale: 2.0
  oversample_factor: 16
  minimum_distance_factor: 0.70
  repair_steps: 40
  minimum_vacuum_A: 12.0
  maximum_slab_thickness_A: 10.0
  maximum_nearest_radius_ratio: 1.60
  minimum_atomic_layers: 5
  surface_profile: ../../models/metadata/surface_geometry_summary.json
  chgnet_relax_fmax: 0.05
  chgnet_relax_steps: 250
