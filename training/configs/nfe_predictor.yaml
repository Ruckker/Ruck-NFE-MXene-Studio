# 中文：NFE 预测器 1.0 检查点所用的训练配置（保留以复现 1.0）。新训练请用 nfe_predictor_v1_1.yaml。
# English: Training configuration of the 1.0 predictor checkpoint (kept for reproduction). New runs
#          should use nfe_predictor_v1_1.yaml.
# Author: Ruck
# Generated: 2026-07-29 20:36:56 Asia/Shanghai
# Revised: 2026-09-15 — 移除了与本任务无关的生成器段（它们仍指向已删除的 baseline_generator）；
#          增加 canonicalize / complete_shells / primary_task 字段的显式默认值。
# 提示 / Tip: 修改依赖、路径或阈值后，请重新运行测试与冒烟验证。
# Re-run tests and smoke validation after changing dependencies, paths, or thresholds.
seed: 2027

data:
  table: ../../data/full/nfe_dataset.csv
  root: ../../data/full
  cache: ../../cache/nfe_graphs.pt
  radius: 6.0
  max_neighbors: 36
  # 1.0 behaviour: structures exactly as stored, neighbour cut may split a shell.
  canonicalize: false
  complete_shells: false
  rebuild_cache: false
  max_cache_skip_fraction: 0.01
  num_workers: 8
  pin_memory: true

model:
  hidden_dim: 192
  vector_dim: 64
  num_layers: 6
  num_rbf: 48
  cutoff: 6.0
  dropout: 0.12
  max_atomic_number: 118
  element_features: 14
  global_features: 11

training:
  epochs: 220
  pretrain_epochs: 35
  batch_size_per_gpu: 96
  grad_accum_steps: 1
  learning_rate: 0.0003
  min_learning_rate: 0.000005
  weight_decay: 0.00001
  warmup_epochs: 8
  grad_clip: 5.0
  amp: true
  compile: false
  early_stopping_patience: 35
  # three_class reproduces 1.0 checkpoint selection; high_vs_rest is recommended.
  primary_task: three_class
  checkpoint_dir: nfe_predictor
  log_every: 25

loss:
  class_weight: 1.0
  score_weight: 1.5
  auxiliary_weight: 0.45
  masked_atom_weight: 0.35
  denoise_weight: 0.65
  label_smoothing: 0.04
  mask_probability: 0.15
  coordinate_noise_min_A: 0.01
  coordinate_noise_max_A: 0.15

inference:
  mc_samples: 30
  confidence_level: 0.90
  embedding_bank_size: 4096
