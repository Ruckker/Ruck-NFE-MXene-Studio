# 中文：`nfe_predictor.yaml` 的配置、依赖或构建说明。
# English: Configuration, dependency, or build instructions for `nfe_predictor.yaml`.
# Formal predictor/benchmark runs use audited v2.2 graph semantics and a separate cache file.
seed: 2027

data:
  table: ../../data/full/nfe_dataset.csv
  root: ../../data/full
  cache: ../../cache/nfe_graphs_v2_2.pt
  radius: 6.0
  max_neighbors: 36
  rebuild_cache: false
  max_cache_skip_fraction: 0.01
  num_workers: 8
  pin_memory: true

model:
  hidden_dim: 192
  vector_dim: 64
  num_layers: 6
  num_rbf: 48
  cutoff: 6.0
  dropout: 0.12
  max_atomic_number: 118
  element_features: 14
  global_features: 11

training:
  epochs: 220
  pretrain_epochs: 35
  batch_size_per_gpu: 96
  grad_accum_steps: 1
  learning_rate: 0.0003
  min_learning_rate: 0.000005
  weight_decay: 0.00001
  warmup_epochs: 8
  grad_clip: 5.0
  amp: true
  compile: false
  early_stopping_patience: 35
  checkpoint_dir: nfe_predictor
  log_every: 25

loss:
  class_weight: 1.0
  score_weight: 1.5
  auxiliary_weight: 0.45
  masked_atom_weight: 0.35
  denoise_weight: 0.65
  label_smoothing: 0.04
  mask_probability: 0.15
  coordinate_noise_min_A: 0.01
  coordinate_noise_max_A: 0.15

inference:
  mc_samples: 30
  confidence_level: 0.90
  embedding_bank_size: 4096

generator_model:
  hidden_dim: 192
  vector_dim: 64
  num_layers: 6
  num_rbf: 64
  cutoff: 12.0
  max_neighbors: 24
  dropout: 0.10
  max_atomic_number: 118
  element_features: 14
  condition_dim: 128

generator_training:
  epochs: 320
  batch_size_per_gpu: 64
  grad_accum_steps: 1
  learning_rate: 0.0002
  min_learning_rate: 0.000003
  weight_decay: 0.00001
  warmup_epochs: 10
  grad_clip: 5.0
  amp: true
  early_stopping_patience: 45
  checkpoint_dir: baseline_generator

generator_loss:
  coordinate_weight: 1.0
  lattice_weight: 0.70
  repulsion_weight: 0.12
  condition_dropout: 0.15

generation:
  sampling_steps: 100
  guidance_scale: 2.5
  oversample_factor: 8
  minimum_distance_factor: 0.58
  repair_steps: 80
  minimum_vacuum_A: 5.0
  maximum_slab_thickness_A: 12.0
  maximum_nearest_radius_ratio: 1.85
  minimum_atomic_layers: 3
