name: benchmark-audit-v2-4

on:
  push:
    branches:
      - fix/benchmark-audit-1-8
  pull_request:

jobs:
  audit-v2-4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audited core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,baseline-classical]"

      - name: Compile v2.4 formal and paper modules
        run: |
          python -m py_compile \
            src/nfe_model/data_v2.py \
            src/nfe_model/data_contract.py \
            src/nfe_model/formal_config.py \
            src/nfe_model/formal_data.py \
            src/nfe_model/provenance_v2.py \
            src/nfe_model/pair_symmetric_graph.py \
            src/nfe_model/checkpoint_contract.py \
            src/nfe_model/prediction_manifest.py \
            src/nfe_model/predict_formal.py \
            training/formal_v2_4.py \
            training/baselines/run.py \
            training/baselines/summarize.py \
            training/baselines/official/backends.py \
            training/baselines/official/run.py \
            training/ablations/summarize.py \
            training/evaluation/audit_cache_rebuild_integrity.py \
            training/evaluation/audit_cache_tensor_sanity.py \
            training/evaluation/audit_split_duplicates.py \
            training/evaluation/audit_neighbor_pair_symmetry.py \
            training/evaluation/audit_checkpoint_integrity.py \
            training/evaluation/sign_predictions_formal.py \
            training/evaluation/paper_preflight_strict.py \
            training/evaluation/formal_multiseed_bootstrap.py \
            training/evaluation/formal_multiseed_bootstrap_strict.py \
            training/evaluation/build_verified_review_queue_paper.py \
            training/evaluation/blind_verified_review_queue.py \
            training/evaluation/freeze_verified_review_paper.py \
            training/evaluation/evaluate_verified_paper.py \
            training/evaluation/formal_verified_sensitivity.py \
            training/evaluation/formal_evaluate_slices.py \
            training/evaluation/supercell_consistency.py

      - name: Verify canonical dispatcher imports before target modules
        run: |
          python -m training.formal_v2_4 --help

      - name: Check shell launchers
        run: |
          bash -n training/baselines/run_4gpu.sh
          bash -n training/ablations/run_4gpu.sh

      - name: Run v2.4 regression suite
        run: |
          pytest -q \
            tests/test_smoke.py \
            tests/test_baseline_models.py \
            tests/test_baseline_summarize.py \
            tests/test_ablation_model.py \
            tests/test_ablation_policy.py \
            tests/test_ablation_summarize.py \
            tests/test_benchmark_audit.py \
            tests/test_audit_v2.py \
            tests/test_formal_contract_v2.py \
            tests/test_pair_symmetric_graph.py \
            tests/test_periodic_graph_symmetry.py \
            tests/test_prediction_manifest.py \
            tests/test_checkpoint_contract.py \
            tests/test_official_cgcnn_adapter.py \
            tests/test_formal_output_gitignore.py \
            tests/test_formal_output_gitignore_extra.py \
            tests/test_repository_integrity.py
