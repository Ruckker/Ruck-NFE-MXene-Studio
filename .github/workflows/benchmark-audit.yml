name: benchmark-audit

on:
  push:
    branches:
      - fix/benchmark-audit-1-8
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audited core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,baseline-classical]"

      - name: Compile audited Python modules
        run: |
          python -m py_compile \
            src/nfe_model/data_contract.py \
            src/nfe_model/data_v2.py \
            src/nfe_model/formal_config.py \
            src/nfe_model/formal_data.py \
            src/nfe_model/provenance_v2.py \
            src/nfe_model/train_audit_v2.py \
            src/nfe_model/train.py \
            src/nfe_model/train_ablation.py \
            src/nfe_model/predict_guard.py \
            src/nfe_model/predict_formal.py \
            src/nfe_model/prediction_manifest.py \
            src/nfe_model/checkpoint_contract.py \
            training/baselines/common.py \
            training/baselines/run.py \
            training/baselines/summarize.py \
            training/baselines/official/backends.py \
            training/baselines/official/run.py \
            training/ablations/summarize.py \
            training/evaluation/audit_split_duplicates.py \
            training/evaluation/evaluate_verified_nfe.py \
            training/evaluation/build_ood_manifest.py \
            training/evaluation/evaluate_slices.py \
            training/evaluation/paired_bootstrap.py \
            training/evaluation/formal_multiseed_bootstrap.py \
            training/evaluation/sign_predictions_formal.py \
            training/evaluation/paper_preflight.py \
            training/evaluation/supercell_consistency.py

      - name: Check shell launchers
        run: |
          bash -n training/baselines/run_4gpu.sh
          bash -n training/ablations/run_4gpu.sh

      - name: Run audit regression tests
        run: |
          pytest -q \
            tests/test_smoke.py \
            tests/test_baseline_models.py \
            tests/test_baseline_summarize.py \
            tests/test_ablation_model.py \
            tests/test_ablation_policy.py \
            tests/test_ablation_summarize.py \
            tests/test_benchmark_audit.py \
            tests/test_audit_v2.py \
            tests/test_formal_contract_v2.py \
            tests/test_prediction_manifest.py \
            tests/test_official_cgcnn_adapter.py \
            tests/test_formal_output_gitignore.py \
            tests/test_checkpoint_contract.py
